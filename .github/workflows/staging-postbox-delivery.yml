name: Staging Postbox Delivery

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character audit candidate SHA to verify
        required: true
        type: string
      confirmation:
        description: Type RUN_STAGING_POSTBOX_DELIVERY
        required: true
        type: string
  push:
    branches:
      - audit/production-readiness
    paths:
      - .github/workflows/staging-postbox-delivery.yml
      - app/%5Fiburo/staging-postbox-verify/route.ts

permissions:
  contents: read

jobs:
  verify:
    if: github.ref_name == 'audit/production-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IB_STAGING_BASE_URL: https://iburo127-app-git-audit-pr-0d0d70-misterio712rino-9166s-projects.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Exact staging Postbox gate
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'RUN_STAGING_POSTBOX_DELIVERY' }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/audit/production-readiness" ]; then
            echo "STAGING_POSTBOX_GATE_FAIL: audit branch required" >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != "RUN_STAGING_POSTBOX_DELIVERY" ]; then
            echo "STAGING_POSTBOX_GATE_FAIL: confirmation mismatch" >&2
            exit 1
          fi
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "STAGING_POSTBOX_GATE_FAIL: candidate SHA must be 40 lowercase hex characters" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$actual_sha" != "$REQUESTED_SHA" ]; then
            echo "STAGING_POSTBOX_GATE_FAIL: exact candidate mismatch" >&2
            exit 1
          fi
          echo "STAGING_POSTBOX_GATE_PASS: $actual_sha"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify exact protected Preview identity
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          identity_file="$RUNNER_TEMP/staging-postbox-identity.json"
          max_attempts=18
          delay_seconds=5
          rm -f "$identity_file"
          trap 'rm -f "$identity_file"' EXIT

          for attempt in $(seq 1 "$max_attempts"); do
            http_status="$(
              curl --silent --show-error \
                --connect-timeout 5 \
                --max-time 15 \
                --output "$identity_file" \
                --write-out '%{http_code}' \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$IB_STAGING_BASE_URL/_iburo/staging-identity" \
                || true
            )"

            if [ "$http_status" = "200" ] && IDENTITY_FILE="$identity_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try {
                const body = JSON.parse(readFileSync(process.env.IDENTITY_FILE, "utf8"));
                if (
                  body.service === "iburo127" &&
                  body.environment === "preview" &&
                  body.branch === "audit/production-readiness" &&
                  body.commitSha === process.env.GITHUB_SHA &&
                  body.runtimeTarget === "staging" &&
                  body.backendEnabled === true
                ) process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              echo "STAGING_POSTBOX_IDENTITY_PASS"
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "STAGING_POSTBOX_IDENTITY_WAIT: attempt=$attempt/$max_attempts"
              sleep "$delay_seconds"
            fi
          done

          echo "STAGING_POSTBOX_IDENTITY_FAIL" >&2
          exit 1

      - name: Read protected Preview Postbox inventory
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          inventory_file="$RUNNER_TEMP/staging-postbox-inventory.json"
          http_status="$(
            curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 20 \
              --output "$inventory_file" \
              --write-out '%{http_code}' \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$IB_STAGING_BASE_URL/_iburo/staging-external-readiness" \
              || true
          )"
          if [ "$http_status" != "200" ]; then
            echo "STAGING_POSTBOX_INVENTORY_FAIL: http_status=$http_status" >&2
            exit 1
          fi
          INVENTORY_FILE="$inventory_file" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const body = JSON.parse(readFileSync(process.env.INVENTORY_FILE, "utf8"));
            const phase = body.phases?.postbox;
            const safeDiagnostic = {
              serviceMatches: body.service === "iburo127",
              operationMatches: body.operation === "staging-external-readiness",
              environmentMatches: body.environment === "preview",
              branchMatches: body.branch === "audit/production-readiness",
              commitShaMatches: body.commitSha === process.env.GITHUB_SHA,
              runtimeTargetMatches: body.runtimeTarget === "staging",
              networkAccessed: body.networkAccessed,
              valuesPrinted: body.valuesPrinted,
              phasePresent: Boolean(phase),
              phaseKeys: phase && typeof phase === "object" ? Object.keys(phase).sort() : [],
              ready: typeof phase?.ready === "boolean" ? phase.ready : null,
              requiredCount: Number.isInteger(phase?.requiredCount) ? phase.requiredCount : null,
              configuredCount: Number.isInteger(phase?.configuredCount) ? phase.configuredCount : null,
              missingOrPlaceholder: Array.isArray(phase?.missingOrPlaceholder) ? phase.missingOrPlaceholder : null,
              invalidOrInconsistent: Array.isArray(phase?.invalidOrInconsistent) ? phase.invalidOrInconsistent : null,
            };
            console.log(`STAGING_POSTBOX_INVENTORY_DIAGNOSTIC: ${JSON.stringify(safeDiagnostic)}`);
            if (
              !safeDiagnostic.serviceMatches ||
              !safeDiagnostic.operationMatches ||
              !safeDiagnostic.environmentMatches ||
              !safeDiagnostic.branchMatches ||
              !safeDiagnostic.commitShaMatches ||
              !safeDiagnostic.runtimeTargetMatches ||
              safeDiagnostic.networkAccessed !== false ||
              safeDiagnostic.valuesPrinted !== false ||
              !safeDiagnostic.phasePresent ||
              safeDiagnostic.ready === null ||
              safeDiagnostic.requiredCount === null ||
              safeDiagnostic.configuredCount === null ||
              safeDiagnostic.missingOrPlaceholder === null ||
              safeDiagnostic.invalidOrInconsistent === null
            ) process.exit(1);
            console.log(`STAGING_POSTBOX_INVENTORY: ${JSON.stringify({
              ready: safeDiagnostic.ready,
              requiredCount: safeDiagnostic.requiredCount,
              configuredCount: safeDiagnostic.configuredCount,
              missingOrPlaceholder: safeDiagnostic.missingOrPlaceholder,
              invalidOrInconsistent: safeDiagnostic.invalidOrInconsistent,
            })}`);
          '

      - name: Verify Postbox delivery through protected Preview runtime
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          verify_file="$RUNNER_TEMP/staging-postbox-verify.json"
          http_status="$(
            curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 30 \
              --output "$verify_file" \
              --write-out '%{http_code}' \
              --request POST \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-iburo-staging-postbox-confirm: RUN_STAGING_POSTBOX_VERIFY" \
              "$IB_STAGING_BASE_URL/_iburo/staging-postbox-verify" \
              || true
          )"

          if [ "$http_status" = "200" ] && VERIFY_FILE="$verify_file" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const body = JSON.parse(readFileSync(process.env.VERIFY_FILE, "utf8"));
            if (
              body.service !== "iburo127" ||
              body.operation !== "staging-postbox-verify" ||
              body.environment !== "preview" ||
              body.branch !== "audit/production-readiness" ||
              body.commitSha !== process.env.GITHUB_SHA ||
              body.runtimeTarget !== "staging" ||
              body.provider !== "yandex-postbox" ||
              body.verified !== true ||
              body.simulatorOnly !== true ||
              body.recipient !== "success@simulator.pstbx.ru" ||
              body.networkAccessed !== true ||
              body.valuesPrinted !== false ||
              body.clientCaseDataIncluded !== false ||
              body.providerResponseLogged !== false
            ) process.exit(1);
          '; then
            echo "STAGING_POSTBOX_DELIVERY_PASS"
            exit 0
          fi

          VERIFY_FILE="$verify_file" HTTP_STATUS="$http_status" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            let body = {};
            try { body = JSON.parse(readFileSync(process.env.VERIFY_FILE, "utf8")); } catch {}
            const safe = {
              httpStatus: process.env.HTTP_STATUS,
              verified: body.verified === true,
              errorCode: typeof body.errorCode === "string" ? body.errorCode : null,
              networkAccessed: body.networkAccessed === true,
              valuesPrinted: body.valuesPrinted === true,
            };
            console.error(`STAGING_POSTBOX_DELIVERY_DIAGNOSTIC: ${JSON.stringify(safe)}`);
          '
          echo "STAGING_POSTBOX_DELIVERY_FAIL" >&2
          exit 1
