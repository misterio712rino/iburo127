name: Staging Postbox Delivery

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character audit candidate SHA to verify
        required: true
        type: string
      confirmation:
        description: Type RUN_STAGING_POSTBOX_DELIVERY
        required: true
        type: string
  push:
    branches:
      - audit/production-readiness
    paths:
      - .github/workflows/staging-postbox-delivery.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.ref_name == 'audit/production-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IB_RUNTIME_TARGET: staging
      IB_EMAIL_TARGET: staging
      YANDEX_POSTBOX_FROM_EMAIL: ${{ secrets.YANDEX_POSTBOX_FROM_EMAIL }}
      YANDEX_POSTBOX_ACCESS_KEY_ID: ${{ secrets.YANDEX_POSTBOX_ACCESS_KEY_ID }}
      YANDEX_POSTBOX_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_POSTBOX_SECRET_ACCESS_KEY }}
      IB_STAGING_POSTBOX_FROM_EMAIL: ${{ secrets.YANDEX_POSTBOX_FROM_EMAIL }}
      IB_STAGING_POSTBOX_ACCESS_KEY_ID: ${{ secrets.YANDEX_POSTBOX_ACCESS_KEY_ID }}
      IB_STAGING_POSTBOX_CONFIRM: "SIMULATOR:${{ secrets.YANDEX_POSTBOX_FROM_EMAIL }}"
      YANDEX_POSTBOX_REQUEST_TIMEOUT_MS: "10000"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Exact staging Postbox gate
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'RUN_STAGING_POSTBOX_DELIVERY' }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/audit/production-readiness" ]; then
            echo "STAGING_POSTBOX_GATE_FAIL: audit branch required" >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != "RUN_STAGING_POSTBOX_DELIVERY" ]; then
            echo "STAGING_POSTBOX_GATE_FAIL: confirmation mismatch" >&2
            exit 1
          fi
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "STAGING_POSTBOX_GATE_FAIL: candidate SHA must be 40 lowercase hex characters" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$actual_sha" != "$REQUESTED_SHA" ]; then
            echo "STAGING_POSTBOX_GATE_FAIL: exact candidate mismatch" >&2
            exit 1
          fi
          echo "STAGING_POSTBOX_GATE_PASS: $actual_sha"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Postbox staging inventory
        run: npm run staging:env:inventory -- --phase=postbox

      - name: Verify Postbox delivery with Yandex simulator
        run: npm run check:staging:email-delivery
