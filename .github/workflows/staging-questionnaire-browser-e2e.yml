name: Staging Questionnaire Browser E2E

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA to verify
        required: true
        type: string
      confirmation:
        description: Type RUN_STAGING_QUESTIONNAIRE_BROWSER_E2E
        required: true
        type: string

permissions:
  contents: read

# This manual replay uses the same fixture as the application E2E. Avoid a
# second automatic push run: GitHub cancels older pending runs in one group.
concurrency:
  group: staging-application-e2e-audit-production-readiness
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == 'audit/production-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IB_RUNTIME_TARGET: staging
      IB_STAGING_BASE_URL: https://iburo127-app-git-audit-producti-0d0d70-misterio712rino-projects.vercel.app
      IB_STAGING_DATABASE_NAME: neondb
      IB_STAGING_CLIENT_EMAIL: client.staging-e2e@example.test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Exact staging gate
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'RUN_STAGING_QUESTIONNAIRE_BROWSER_E2E' }}
        run: |
          if [ "$CONFIRMATION" != "RUN_STAGING_QUESTIONNAIRE_BROWSER_E2E" ]; then
            echo "STAGING_QUESTIONNAIRE_BROWSER_GATE_FAIL: confirmation mismatch" >&2
            exit 1
          fi
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "STAGING_QUESTIONNAIRE_BROWSER_GATE_FAIL: candidate SHA must be 40 lowercase hex characters" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$actual_sha" != "$REQUESTED_SHA" ]; then
            echo "STAGING_QUESTIONNAIRE_BROWSER_GATE_FAIL: exact candidate mismatch" >&2
            exit 1
          fi
          echo "STAGING_QUESTIONNAIRE_BROWSER_GATE_PASS: $actual_sha"

      - name: GitHub Actions pin policy
        run: npm run check:ci-action-pins

      - name: GitHub workflow security policy
        run: npm run check:ci-workflow-security

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact protected Preview identity
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          response_file="$RUNNER_TEMP/questionnaire-preview-identity.json"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 24); do
            http_status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
              --output "$response_file" --write-out '%{http_code}' \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$IB_STAGING_BASE_URL/_iburo/staging-identity" || true)"
            if [ "$http_status" = "200" ] && RESPONSE_FILE="$response_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const body = JSON.parse(readFileSync(process.env.RESPONSE_FILE, "utf8"));
              if (body.service !== "iburo127" || body.environment !== "preview" || body.branch !== "audit/production-readiness" || body.commitSha !== process.env.GITHUB_SHA || body.runtimeTarget !== "staging" || body.backendEnabled !== true) process.exit(1);
            '; then
              echo "STAGING_QUESTIONNAIRE_PREVIEW_IDENTITY_PASS"
              exit 0
            fi
            if [ "$attempt" -lt 24 ]; then sleep 3; fi
          done
          echo "STAGING_QUESTIONNAIRE_PREVIEW_IDENTITY_FAIL" >&2
          exit 1

      - name: Bootstrap dedicated client auth fixture
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          response_file="$RUNNER_TEMP/questionnaire-auth-fixture.json"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 6); do
            http_status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
              --output "$response_file" --write-out '%{http_code}' -X POST \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-iburo-staging-control: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "Origin: $IB_STAGING_BASE_URL" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "confirm=BOOTSTRAP_CLIENT_PLAN_AUTH:${IB_STAGING_DATABASE_NAME}:public:${GITHUB_SHA}" \
              "$IB_STAGING_BASE_URL/_iburo/staging-client-plan-auth-fixtures" || true)"
            if [ "$http_status" = "200" ]; then
              echo "STAGING_QUESTIONNAIRE_AUTH_FIXTURE_PASS"
              exit 0
            fi
            failure_stage="$(RESPONSE_FILE="$response_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try { const body = JSON.parse(readFileSync(process.env.RESPONSE_FILE, "utf8")); process.stdout.write(typeof body.failureStage === "string" ? body.failureStage : "unavailable"); } catch { process.stdout.write("unavailable"); }
            ')"
            if [ "$attempt" -lt 6 ] && { [ "$http_status" = "000" ] || [ "$failure_stage" = "confirmation" ] || [ "$failure_stage" = "lock" ]; }; then
              sleep 2
              continue
            fi
            echo "STAGING_QUESTIONNAIRE_AUTH_FIXTURE_FAIL: http_status=$http_status failure_stage=$failure_stage" >&2
            exit 1
          done
          exit 1

      - name: Reset dedicated application E2E fixture
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          response_file="$RUNNER_TEMP/questionnaire-fixture-reset.json"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 6); do
            http_status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
              --output "$response_file" --write-out '%{http_code}' -X POST \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-iburo-staging-control: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "Origin: $IB_STAGING_BASE_URL" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "confirm=RESET_APPLICATION_E2E:${IB_STAGING_DATABASE_NAME}:public:${GITHUB_SHA}" \
              "$IB_STAGING_BASE_URL/_iburo/staging-application-e2e-fixtures" || true)"
            if [ "$http_status" = "200" ]; then
              echo "STAGING_QUESTIONNAIRE_FIXTURE_RESET_PASS"
              exit 0
            fi
            if [ "$attempt" -lt 6 ] && { [ "$http_status" = "000" ] || [ "$http_status" = "403" ] || [ "$http_status" = "503" ]; }; then
              sleep 2
              continue
            fi
            echo "STAGING_QUESTIONNAIRE_FIXTURE_RESET_FAIL: http_status=$http_status" >&2
            exit 1
          done
          exit 1

      - name: Install pinned Chromium browser runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Dedicated questionnaire Chromium E2E
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          IB_STAGING_CLIENT_PASSWORD: ${{ secrets.IB_STAGING_CLIENT_PASSWORD }}
        run: node scripts/staging-questionnaire-browser-e2e.mjs
