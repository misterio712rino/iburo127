name: Staging File Scanner Smoke

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA to verify
        required: true
        type: string
      scanner_origin:
        description: Exact staging scanner HTTPS origin
        required: true
        type: string
      blob_private_host:
        description: Exact staging Vercel Blob private hostname, without scheme
        required: true
        type: string
      scanner_secret_sha256:
        description: SHA-256 fingerprint of the staging scanner shared secret
        required: true
        type: string
      confirmation:
        description: Type RUN_STAGING_FILE_SCANNER_SMOKE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-file-scanner-smoke
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == 'audit/production-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      IB_STAGING_BASE_URL: https://iburo127-app-git-audit-pr-0d0d70-misterio712rino-9166s-projects.vercel.app
      IB_RUNTIME_TARGET: staging
      IB_FILE_SCANNER_TARGET: staging
      IB_STORAGE_TARGET: staging
      VERCEL_ENV: preview
      VERCEL_GIT_COMMIT_REF: audit/production-readiness
      IB_VERCEL_BLOB_AUTH_MODE: read-write-token
      IB_FILE_SCANNER_REQUEST_TIMEOUT_MS: "60000"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Exact staging gate
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "RUN_STAGING_FILE_SCANNER_SMOKE" ]; then
            echo "STAGING_FILE_SCANNER_SMOKE_GATE_FAIL: confirmation mismatch" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/audit/production-readiness" ]; then
            echo "STAGING_FILE_SCANNER_SMOKE_GATE_FAIL: branch mismatch" >&2
            exit 1
          fi
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "STAGING_FILE_SCANNER_SMOKE_GATE_FAIL: candidate SHA must be 40 lowercase hex characters" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$actual_sha" != "$REQUESTED_SHA" ]; then
            echo "STAGING_FILE_SCANNER_SMOKE_GATE_FAIL: exact candidate mismatch" >&2
            exit 1
          fi
          echo "STAGING_FILE_SCANNER_SMOKE_GATE_PASS: $actual_sha"

      - name: GitHub Actions pin policy
        run: npm run check:ci-action-pins

      - name: GitHub workflow security policy
        run: npm run check:ci-workflow-security

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact protected Preview identity
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          identity_file="$RUNNER_TEMP/staging-file-scanner-identity.json"
          max_attempts=24
          delay_seconds=3
          required_consecutive_passes=3
          consecutive_passes=0
          rm -f "$identity_file"
          trap 'rm -f "$identity_file"' EXIT

          for attempt in $(seq 1 "$max_attempts"); do
            http_status="$(
              curl --silent --show-error \
                --output "$identity_file" \
                --write-out '%{http_code}' \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$IB_STAGING_BASE_URL/_iburo/staging-identity" \
                || true
            )"

            if [ "$http_status" = "200" ] && IDENTITY_FILE="$identity_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try {
                const body = JSON.parse(readFileSync(process.env.IDENTITY_FILE, "utf8"));
                if (
                  body.service === "iburo127" &&
                  body.environment === "preview" &&
                  body.branch === "audit/production-readiness" &&
                  body.commitSha === process.env.GITHUB_SHA &&
                  body.runtimeTarget === "staging" &&
                  body.backendEnabled === true
                ) process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              consecutive_passes=$((consecutive_passes + 1))
              echo "STAGING_FILE_SCANNER_IDENTITY_MATCH: $consecutive_passes/$required_consecutive_passes"
              if [ "$consecutive_passes" -ge "$required_consecutive_passes" ]; then
                echo "STAGING_FILE_SCANNER_IDENTITY_PASS"
                exit 0
              fi
            else
              consecutive_passes=0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$delay_seconds"
            fi
          done

          echo "STAGING_FILE_SCANNER_IDENTITY_FAIL" >&2
          exit 1

      - name: Verify live staging scanner CLEAN and MALICIOUS verdicts
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.IB_STAGING_BLOB_READ_WRITE_TOKEN }}
          IB_FILE_SCANNER_SECRET: ${{ secrets.IB_STAGING_FILE_SCANNER_SECRET }}
          IB_FILE_SCANNER_ORIGIN: ${{ inputs.scanner_origin }}
          IB_STAGING_FILE_SCANNER_ORIGIN: ${{ inputs.scanner_origin }}
          IB_STAGING_VERCEL_BLOB_PRIVATE_HOST: ${{ inputs.blob_private_host }}
          IB_STAGING_FILE_SCANNER_SECRET_SHA256: ${{ inputs.scanner_secret_sha256 }}
        run: |
          test -n "$BLOB_READ_WRITE_TOKEN"
          test -n "$IB_FILE_SCANNER_SECRET"

          confirmation="$(node --input-type=module <<'NODE'
          const fingerprint = process.env.IB_STAGING_FILE_SCANNER_SECRET_SHA256?.trim().toLowerCase() ?? "";
          if (!/^[a-f0-9]{64}$/.test(fingerprint)) process.exit(1);
          let scanner;
          try {
            scanner = new URL(process.env.IB_STAGING_FILE_SCANNER_ORIGIN ?? "");
          } catch {
            process.exit(1);
          }
          process.stdout.write(`FILE-SCANNER-SMOKE:${scanner.hostname}:vercel-blob:${fingerprint}`);
          NODE
          )"
          test -n "$confirmation"

          export IB_STAGING_FILE_SCANNER_CONFIRM="$confirmation"
          export IB_STAGING_FILE_SCANNER_CLEAN_OBJECT_KEY="security-fixtures/file-scanner/$GITHUB_SHA/clean.txt"
          export IB_STAGING_FILE_SCANNER_MALICIOUS_OBJECT_KEY="security-fixtures/file-scanner/$GITHUB_SHA/eicar.txt"
          npm run check:staging:file-scanner
