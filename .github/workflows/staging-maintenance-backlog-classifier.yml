name: Staging Maintenance Backlog Classifier

on:
  push:
    branches:
      - audit/production-readiness

permissions:
  contents: read

jobs:
  classify:
    if: github.ref_name == 'audit/production-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stale_total: ${{ steps.aggregate.outputs.stale_total }}
      stale_strict: ${{ steps.aggregate.outputs.stale_strict }}
      stale_unknown: ${{ steps.aggregate.outputs.stale_unknown }}
      deletion_total: ${{ steps.aggregate.outputs.deletion_total }}
      deletion_strict: ${{ steps.aggregate.outputs.deletion_strict }}
      deletion_unknown: ${{ steps.aggregate.outputs.deletion_unknown }}
    env:
      IB_STAGING_BASE_URL: https://iburo127-app-git-audit-producti-0d0d70-misterio712rino-projects.vercel.app

    steps:
      - name: Verify exact protected Preview and classify maintenance backlog
        id: aggregate
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          identity_file="$RUNNER_TEMP/staging-maintenance-classifier-identity.json"
          classifier_file="$RUNNER_TEMP/staging-maintenance-classifier.json"
          rm -f "$identity_file" "$classifier_file"
          trap 'rm -f "$identity_file" "$classifier_file"' EXIT

          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 15               --output "$identity_file" --write-out '%{http_code}'               -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"               "$IB_STAGING_BASE_URL/_iburo/staging-identity" || true)"
            if [ "$status" = "200" ] && IDENTITY_FILE="$identity_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try {
                const b=JSON.parse(readFileSync(process.env.IDENTITY_FILE,"utf8"));
                if (b.service==="iburo127" && b.environment==="preview" &&
                    b.branch==="audit/production-readiness" &&
                    b.commitSha===process.env.GITHUB_SHA &&
                    b.runtimeTarget==="staging" && b.backendEnabled===true) process.exit(0);
              } catch {}
              process.exit(1);
            '; then break; fi
            if [ "$attempt" = 18 ]; then
              echo "STAGING_MAINTENANCE_CLASSIFIER_IDENTITY_FAIL" >&2
              exit 1
            fi
            sleep 5
          done

          for attempt in $(seq 1 6); do
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 20               --output "$classifier_file" --write-out '%{http_code}'               -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"               "$IB_STAGING_BASE_URL/_iburo/staging-maintenance-backlog-classifier" || true)"
            if [ "$status" = "200" ] && CLASSIFIER_FILE="$classifier_file" node --input-type=module -e '
              import { appendFileSync, readFileSync } from "node:fs";
              try {
                const b=JSON.parse(readFileSync(process.env.CLASSIFIER_FILE,"utf8"));
                const n=(v)=>Number.isInteger(v)&&v>=0;
                const counts=[
                  b?.staleUploads?.overdue,b?.staleUploads?.identityTechnical,
                  b?.staleUploads?.strictKnownTechnicalFixtures,b?.staleUploads?.unknownOrNonTechnical,
                  b?.fileDeletion?.overduePending,b?.fileDeletion?.identityTechnical,
                  b?.fileDeletion?.strictKnownTechnicalFixtures,b?.fileDeletion?.unknownOrNonTechnical,
                ];
                if (b?.service!=="iburo127" ||
                    b?.operation!=="staging-maintenance-backlog-classifier" ||
                    b?.environment!=="preview" ||
                    b?.branch!=="audit/production-readiness" ||
                    b?.commitSha!==process.env.GITHUB_SHA ||
                    b?.runtimeTarget!=="staging" ||
                    b?.readOnly!==true || b?.aggregateOnly!==true ||
                    b?.valuesPrinted!==false || !counts.every(n) ||
                    b.staleUploads.overdue !== b.staleUploads.strictKnownTechnicalFixtures + b.staleUploads.unknownOrNonTechnical ||
                    b.fileDeletion.overduePending !== b.fileDeletion.strictKnownTechnicalFixtures + b.fileDeletion.unknownOrNonTechnical) {
                  process.exit(1);
                }
                appendFileSync(process.env.GITHUB_OUTPUT, [
                  `stale_total=${b.staleUploads.overdue}`,
                  `stale_strict=${b.staleUploads.strictKnownTechnicalFixtures}`,
                  `stale_unknown=${b.staleUploads.unknownOrNonTechnical}`,
                  `deletion_total=${b.fileDeletion.overduePending}`,
                  `deletion_strict=${b.fileDeletion.strictKnownTechnicalFixtures}`,
                  `deletion_unknown=${b.fileDeletion.unknownOrNonTechnical}`,
                  "",
                ].join("\n"));
              } catch { process.exit(1); }
            '; then
              echo "STAGING_MAINTENANCE_BACKLOG_CLASSIFIER_PASS"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 3; fi
          done

          echo "STAGING_MAINTENANCE_BACKLOG_CLASSIFIER_FAIL" >&2
          exit 1

  aggregate-proof:
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    name: >-
      Maintenance backlog
      stale=${{ needs.classify.outputs.stale_total }}
      strict=${{ needs.classify.outputs.stale_strict }}
      unknown=${{ needs.classify.outputs.stale_unknown }}
      deletion=${{ needs.classify.outputs.deletion_total }}
      strict=${{ needs.classify.outputs.deletion_strict }}
      unknown=${{ needs.classify.outputs.deletion_unknown }}
    steps:
      - name: Aggregate proof recorded
        run: echo "STAGING_MAINTENANCE_BACKLOG_AGGREGATE_PROOF_PASS"
