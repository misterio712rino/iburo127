name: Lockfile Refresh Artifact

on:
  push:
    branches:
      - audit/production-readiness
    paths:
      - package.json
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched qs resolution
        run: node --input-type=module -e 'import lock from "./package-lock.json" with { type: "json" }; if (lock.packages?.["node_modules/qs"]?.version !== "6.16.0") process.exit(1); console.log("LOCKFILE_QS_PATCH_PASS")'

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patched-package-lock
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error
