name: Secret History

on:
  push:
    branches:
      - demo/investor-preview
      - audit/production-readiness
  pull_request:

permissions:
  contents: read

jobs:
  history-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout full candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "EXACT_CANDIDATE_CHECKOUT_FAIL: expected=$EXPECTED_SHA actual=$actual_sha" >&2
            exit 1
          fi
          echo "EXACT_CANDIDATE_CHECKOUT_PASS: $actual_sha"

      - name: GitHub Actions pin policy
        run: npm run check:ci-action-pins

      - name: GitHub workflow security policy
        run: npm run check:ci-workflow-security

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Toolchain policy
        run: node scripts/check-toolchain.mjs

      - name: Historical secret exposure policy
        run: node scripts/check-secret-history-exposure.mjs

      - name: Historical secret exposure regression
        run: node tests/secret-history-exposure-policy.test.mjs
