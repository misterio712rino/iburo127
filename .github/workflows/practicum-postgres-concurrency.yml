name: Practicum PostgreSQL Concurrency

on:
  push:
    branches:
      - audit/production-readiness
      - fix/practicum-postgres-concurrency-20260927
  pull_request:

permissions:
  contents: read

jobs:
  practicum-concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iburo_concurrency
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iburo_concurrency"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/iburo_concurrency?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "PRACTICUM_CONCURRENCY_EXACT_SHA_PASS"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/prisma migrate deploy
          ./node_modules/.bin/prisma migrate status

      - name: Run real PostgreSQL practicum concurrency tests
        run: node --conditions=react-server --import tsx tests/practicum-postgres-concurrency.integration.ts
