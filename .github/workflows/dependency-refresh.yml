name: Dependency refresh

on:
  push:
    branches:
      - audit/production-readiness
    paths:
      - .github/dependency-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/production-readiness
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install planned runtime dependencies
        run: npm install better-auth @aws-sdk/client-s3 @aws-sdk/s3-request-presigner --save

      - name: Validate dependency diff scope
        run: |
          git status --short
          test -f package-lock.json
          git diff --exit-code -- . ':!package.json' ':!package-lock.json' || {
            echo "Unexpected files changed by dependency install" >&2
            exit 1
          }

      - name: Commit package files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add auth and object storage dependencies"
          git push origin HEAD:audit/production-readiness
