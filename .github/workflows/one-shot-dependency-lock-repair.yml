name: One-shot Dependency Lock Repair

on:
  push:
    branches:
      - audit/production-readiness

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.event.head_commit.message == 'ci: stage one-shot dependency lock repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 11

    steps:
      - name: Checkout exact helper commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version-file: .nvmrc
          cache: npm
          check-latest: false

      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/production-readiness"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin refs/heads/audit/production-readiness | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          echo "ONE_SHOT_LOCK_REPAIR_GATE_PASS: $actual_sha"

      - name: Repair non-breaking audit findings in lockfile only
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cp package.json "$RUNNER_TEMP/package.json.before"
          npm audit fix --package-lock-only || true
          cmp --silent package.json "$RUNNER_TEMP/package.json.before" || {
            echo "ONE_SHOT_LOCK_REPAIR_FAIL: package.json changed" >&2
            exit 1
          }
          git diff --exit-code -- package.json
          git diff -- package-lock.json
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const raw = execFileSync("npm", ["audit", "--json"], { encoding: "utf8" });
          const report = JSON.parse(raw);
          const highs = Object.entries(report.vulnerabilities ?? {})
            .filter(([, value]) => ["high", "critical"].includes(value.severity))
            .map(([name]) => name)
            .sort();
          if (highs.includes("browserslist")) {
            console.error("ONE_SHOT_LOCK_REPAIR_FAIL: browserslist remains high/critical");
            process.exit(1);
          }
          console.log(`ONE_SHOT_LOCK_REPAIR_AUDIT_REMAINING: ${highs.join(",") || "none"}`);
          NODE

      - name: Remove helper and commit generated lockfile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-dependency-lock-repair.yml
          git add package-lock.json
          git diff --cached --quiet && {
            echo "ONE_SHOT_LOCK_REPAIR_FAIL: no generated changes" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh patched dependency lock"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:audit/production-readiness
          echo "ONE_SHOT_LOCK_REPAIR_PUSH_PASS"
