name: Staging File Scan Worker Preflight

on:
  push:
    branches:
      - audit/production-readiness

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref_name == 'audit/production-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IB_STAGING_BASE_URL: https://iburo127-app-git-audit-producti-0d0d70-misterio712rino-projects.vercel.app

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact protected Preview and worker preflight
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          identity_file="$RUNNER_TEMP/staging-worker-preflight-identity.json"
          preflight_file="$RUNNER_TEMP/staging-worker-preflight.json"
          rm -f "$identity_file" "$preflight_file"
          trap 'rm -f "$identity_file" "$preflight_file"' EXIT

          for attempt in $(seq 1 18); do
            status="$(
              curl --silent --show-error \
                --connect-timeout 5 --max-time 15 \
                --output "$identity_file" --write-out '%{http_code}' \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$IB_STAGING_BASE_URL/_iburo/staging-identity" || true
            )"
            if [ "$status" = "200" ] && IDENTITY_FILE="$identity_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try {
                const b = JSON.parse(readFileSync(process.env.IDENTITY_FILE, "utf8"));
                if (
                  b.service === "iburo127" &&
                  b.environment === "preview" &&
                  b.branch === "audit/production-readiness" &&
                  b.commitSha === process.env.GITHUB_SHA &&
                  b.runtimeTarget === "staging" &&
                  b.backendEnabled === true
                ) process.exit(0);
              } catch {}
              process.exit(1);
            '; then break; fi
            if [ "$attempt" = 18 ]; then
              echo "STAGING_FILE_SCAN_WORKER_PREFLIGHT_IDENTITY_FAIL" >&2
              exit 1
            fi
            sleep 5
          done

          confirmation="PREFLIGHT_STAGING_FILE_SCAN_WORKER:${GITHUB_SHA}"
          http_status="$(
            curl --silent --show-error \
              --connect-timeout 5 --max-time 25 \
              --request POST \
              --output "$preflight_file" --write-out '%{http_code}' \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-iburo-staging-control: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-iburo-staging-file-scan-worker-preflight-confirm: $confirmation" \
              "$IB_STAGING_BASE_URL/_iburo/staging-file-scan-worker-preflight" || true
          )"
          test "$http_status" = "200"

          PREFLIGHT_FILE="$preflight_file" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const b = JSON.parse(readFileSync(process.env.PREFLIGHT_FILE, "utf8"));
            const n = (value) => Number.isInteger(value) && value >= 0;
            if (
              b?.service !== "iburo127" ||
              b?.operation !== "staging-file-scan-worker-preflight" ||
              b?.environment !== "preview" ||
              b?.branch !== "audit/production-readiness" ||
              b?.commitSha !== process.env.GITHUB_SHA ||
              b?.runtimeTarget !== "staging" ||
              b?.pass !== true ||
              b?.readOnly !== true ||
              b?.networkAccessed !== true ||
              b?.valuesPrinted !== false ||
              b?.scanner?.healthy !== true ||
              b?.storage?.providerMatches !== true ||
              b?.worker?.batchLimit !== 1 ||
              b?.worker?.batchIsOne !== true ||
              b?.worker?.sourceUrlTtlCompatible !== true ||
              b?.worker?.leaseTimeoutCompatible !== true ||
              !n(b?.backlog?.pending) ||
              !n(b?.backlog?.dueOrOverdue) ||
              !n(b?.backlog?.unscheduled) ||
              !n(b?.backlog?.zeroAttempts) ||
              !n(b?.backlog?.attempted) ||
              b.backlog.zeroAttempts + b.backlog.attempted !== b.backlog.pending ||
              b.backlog.dueOrOverdue > b.backlog.pending ||
              b.backlog.unscheduled > b.backlog.pending
            ) process.exit(1);

            console.log(
              "STAGING_FILE_SCAN_WORKER_PREFLIGHT_PASS " +
                JSON.stringify({
                  pending: b.backlog.pending,
                  dueOrOverdue: b.backlog.dueOrOverdue,
                  zeroAttempts: b.backlog.zeroAttempts,
                  attempted: b.backlog.attempted,
                  batchLimit: b.worker.batchLimit,
                  scannerHealthy: b.scanner.healthy,
                  standardMaintenanceEndpointConfigured:
                    b.scheduler.standardMaintenanceEndpointConfigured === true,
                }),
            );
          '