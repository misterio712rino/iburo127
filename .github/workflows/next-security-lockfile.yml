name: One-shot Next security lockfile refresh

on:
  push:
    branches:
      - audit/production-readiness
    paths:
      - .github/workflows/next-security-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: contains(github.event.head_commit.message, '[next-lockfile-refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh Next.js production dependency
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.3

      - name: Refresh matching ESLint config
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.3.3

      - name: Verify requested versions
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.3.3'||p.devDependencies['eslint-config-next']!=='16.3.3') process.exit(1)"
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/next'].version!=='16.3.3'||p.packages['node_modules/eslint-config-next'].version!=='16.3.3'||p.packages['node_modules/@next/env'].version!=='16.3.3'||p.packages['node_modules/@next/eslint-plugin-next'].version!=='16.3.3') process.exit(1)"

      - name: Self-remove helper and commit generated manifests
        run: |
          rm .github/workflows/next-security-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/next-security-lockfile.yml
          git diff --cached --quiet && { echo "Expected manifest changes were not produced"; exit 1; }
          git commit -m "chore: upgrade Next.js security baseline to 16.3.3"
          git push origin HEAD:audit/production-readiness
