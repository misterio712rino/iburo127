name: Staging File Scan Cleanup Diagnostic

on:
  push:
    branches:
      - audit/production-readiness

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref_name == 'audit/production-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      IB_STAGING_BASE_URL: https://iburo127-app-git-audit-pr-0d0d70-misterio712rino-9166s-projects.vercel.app

    steps:
      - name: Wait for exact protected Preview and diagnose cleanup boundary
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          identity_file="$RUNNER_TEMP/identity.json"
          cleanup_file="$RUNNER_TEMP/cleanup.json"
          trap 'rm -f "$identity_file" "$cleanup_file"' EXIT

          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              --output "$identity_file" --write-out '%{http_code}' \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$IB_STAGING_BASE_URL/_iburo/staging-identity" || true)"
            if [ "$status" = "200" ] && IDENTITY_FILE="$identity_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try {
                const body = JSON.parse(readFileSync(process.env.IDENTITY_FILE, "utf8"));
                if (body.commitSha === process.env.GITHUB_SHA && body.environment === "preview" && body.branch === "audit/production-readiness" && body.runtimeTarget === "staging" && body.backendEnabled === true) process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              break
            fi
            if [ "$attempt" = "18" ]; then
              echo "STAGING_FILE_SCAN_CLEANUP_DIAGNOSTIC_FAIL: exact_preview_unavailable" >&2
              exit 1
            fi
            sleep 5
          done

          status="$(curl --silent --show-error --connect-timeout 5 --max-time 45 \
            --output "$cleanup_file" --write-out '%{http_code}' --request POST \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H "x-iburo-staging-file-scan-cleanup-confirm: CLEAN_STAGING_FILE_SCAN_FIXTURES:${GITHUB_SHA}" \
            "$IB_STAGING_BASE_URL/_iburo/staging-file-scan-fixture-cleanup" || true)"

          SAFE_CODE="$(CLEANUP_FILE="$cleanup_file" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            try {
              const body = JSON.parse(readFileSync(process.env.CLEANUP_FILE, "utf8"));
              const code = typeof body.errorCode === "string" && /^[A-Z0-9_]+$/.test(body.errorCode) ? body.errorCode : (body.pass === true ? "PASS" : "UNAVAILABLE");
              process.stdout.write(code);
            } catch {
              process.stdout.write("UNAVAILABLE");
            }
          ')"
          echo "STAGING_FILE_SCAN_CLEANUP_DIAGNOSTIC: http_status=$status code=$SAFE_CODE"
          if [ "$status" != "200" ]; then exit 1; fi
