name: Lock Refresh Helper

on:
  push:
    branches:
      - audit/production-readiness
    paths:
      - .github/workflows/lock-refresh-helper.yml

permissions:
  contents: write

jobs:
  generate-and-commit-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact helper commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Refuse stale helper reruns
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          remote_sha="$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${BRANCH_NAME}" | cut -f1)"
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "LOCK_REFRESH_STALE_FAIL: expected remote head $EXPECTED_SHA, got ${remote_sha:-missing}" >&2
            exit 1
          fi
          echo "LOCK_REFRESH_HEAD_PASS: $EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin patched mysql2 and regenerate lock
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          packageJson.overrides = {
            ...(packageJson.overrides ?? {}),
            mysql2: "3.24.3",
          };
          writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts --audit=false --fund=false

      - name: Install hardened dependency policies
        shell: bash
        run: |
          cat > scripts/check-production-install.mjs <<'EOF'
          import { lstat, readFile, readdir } from "node:fs/promises";
          import { join } from "node:path";

          const installRoot = process.argv[2];
          if (!installRoot) {
            console.error("PRODUCTION_DEPENDENCY_GRAPH_FAIL: missing isolated install path");
            process.exit(1);
          }

          const requiredRuntimePackages = new Set([
            "next",
            "react",
            "better-auth",
            "@prisma/client",
            "@prisma/adapter-pg",
          ]);

          const forbiddenReviewedResidualPackages = new Set([
            "prisma",
            "@prisma/config",
            "deepmerge-ts",
          ]);

          const approvedPatchedResidualPackages = new Map([
            ["mysql2", "3.24.3"],
          ]);

          const installed = new Map();

          async function inspectPackage(packageDir) {
            try {
              const packageJson = JSON.parse(await readFile(join(packageDir, "package.json"), "utf8"));
              if (typeof packageJson.name === "string" && typeof packageJson.version === "string") {
                const versions = installed.get(packageJson.name) ?? new Set();
                versions.add(packageJson.version);
                installed.set(packageJson.name, versions);
              }
            } catch {
              // Ignore non-package directories and incomplete metadata; npm ci itself must succeed first.
            }

            await inspectNodeModules(join(packageDir, "node_modules"));
          }

          async function inspectNodeModules(nodeModulesDir) {
            let entries;
            try {
              entries = await readdir(nodeModulesDir, { withFileTypes: true });
            } catch {
              return;
            }

            for (const entry of entries) {
              if (!entry.isDirectory() || entry.name === ".bin") continue;
              const entryPath = join(nodeModulesDir, entry.name);

              if (entry.name.startsWith("@")) {
                let scopedEntries;
                try {
                  scopedEntries = await readdir(entryPath, { withFileTypes: true });
                } catch {
                  continue;
                }
                for (const scopedEntry of scopedEntries) {
                  if (!scopedEntry.isDirectory()) continue;
                  const packageDir = join(entryPath, scopedEntry.name);
                  const stat = await lstat(packageDir);
                  if (!stat.isDirectory()) continue;
                  await inspectPackage(packageDir);
                }
                continue;
              }

              const stat = await lstat(entryPath);
              if (!stat.isDirectory()) continue;
              await inspectPackage(entryPath);
            }
          }

          await inspectNodeModules(join(installRoot, "node_modules"));

          for (const name of requiredRuntimePackages) {
            if (!installed.has(name)) {
              console.error(`PRODUCTION_DEPENDENCY_GRAPH_FAIL: expected runtime package missing: ${name}`);
              process.exit(1);
            }
          }

          for (const name of forbiddenReviewedResidualPackages) {
            if (installed.has(name)) {
              const versions = [...installed.get(name)].sort().join(",");
              console.error(`PRODUCTION_DEPENDENCY_GRAPH_FAIL: reviewed vulnerable dev package present in production install: ${name}@${versions}`);
              process.exit(1);
            }
          }

          for (const [name, approvedVersion] of approvedPatchedResidualPackages) {
            const versions = installed.get(name);
            if (!versions) continue;
            if (versions.size !== 1 || !versions.has(approvedVersion)) {
              console.error(
                `PRODUCTION_DEPENDENCY_GRAPH_FAIL: unapproved ${name} version in production install: ${[...versions].sort().join(",")}`,
              );
              process.exit(1);
            }
          }

          console.log(
            `PRODUCTION_DEPENDENCY_GRAPH_PASS: ${installed.size} package name(s) inspected; Prisma CLI/config residual absent and mysql2 is absent or pinned to approved patched version`,
          );
          EOF

          cat > scripts/check-npm-audit-policy.mjs <<'EOF'
          import { readFile } from "node:fs/promises";

          const [auditPath, lockPath] = process.argv.slice(2);
          if (!auditPath || !lockPath) {
            console.error("DEPENDENCY_AUDIT_POLICY_FAIL: missing audit or lockfile path");
            process.exit(1);
          }

          let report;
          let lockfile;
          try {
            report = JSON.parse(await readFile(auditPath, "utf8"));
            lockfile = JSON.parse(await readFile(lockPath, "utf8"));
          } catch {
            console.error("DEPENDENCY_AUDIT_POLICY_FAIL: unreadable audit report or lockfile");
            process.exit(1);
          }

          if (report?.error) {
            console.error("DEPENDENCY_AUDIT_POLICY_FAIL: npm audit unavailable");
            process.exit(1);
          }

          const vulnerabilities = report?.vulnerabilities;
          if (!vulnerabilities || typeof vulnerabilities !== "object" || Array.isArray(vulnerabilities)) {
            console.error("DEPENDENCY_AUDIT_POLICY_FAIL: invalid npm audit payload");
            process.exit(1);
          }

          // Prisma CLI 7.9.1 still carries reviewed upstream HIGH findings through
          // @prisma/config/deepmerge-ts. Its historical mysql2 3.15.3 pin is overridden
          // to the reviewed patched mysql2 3.24.3 release, so mysql2 must not appear in
          // the vulnerability set. Any package, version, severity or layout drift fails closed.
          const allowedResidual = new Map([
            ["prisma", { version: "7.9.1", severity: "high" }],
            ["@prisma/config", { version: "7.9.1", severity: "high" }],
            ["deepmerge-ts", { version: "7.1.5", severity: "high" }],
          ]);

          const root = lockfile?.packages?.[""];
          const prismaCli = lockfile?.packages?.["node_modules/prisma-cli"];
          const mysql2 = lockfile?.packages?.["node_modules/mysql2"];
          if (!root || !prismaCli || !mysql2) {
            console.error("DEPENDENCY_AUDIT_POLICY_FAIL: expected Prisma CLI residual layout is missing");
            process.exit(1);
          }
          if (root?.devDependencies?.["prisma-cli"] !== "npm:prisma@7.9.1") {
            console.error("DEPENDENCY_AUDIT_POLICY_FAIL: Prisma CLI alias changed");
            process.exit(1);
          }
          for (const runtimeGroup of ["dependencies", "optionalDependencies"]) {
            if (root?.[runtimeGroup]?.["prisma-cli"] || root?.[runtimeGroup]?.mysql2) {
              console.error("DEPENDENCY_AUDIT_POLICY_FAIL: Prisma CLI/mysql2 entered a root runtime dependency group");
              process.exit(1);
            }
          }
          if (prismaCli.name !== "prisma" || prismaCli.version !== "7.9.1" || prismaCli.dev !== true) {
            console.error("DEPENDENCY_AUDIT_POLICY_FAIL: Prisma CLI is no longer the reviewed dev-only 7.9.1 package");
            process.exit(1);
          }
          if (prismaCli.dependencies?.mysql2 !== "3.15.3") {
            console.error("DEPENDENCY_AUDIT_POLICY_FAIL: upstream Prisma CLI mysql2 pin changed; review override assumptions");
            process.exit(1);
          }
          if (mysql2.version !== "3.24.3" || (mysql2.dev !== true && mysql2.devOptional !== true)) {
            console.error("DEPENDENCY_AUDIT_POLICY_FAIL: mysql2 is not the reviewed patched 3.24.3 package");
            process.exit(1);
          }

          const entries = Object.entries(vulnerabilities);
          if (entries.length === 0) {
            console.log("DEPENDENCY_AUDIT_POLICY_PASS: no vulnerabilities reported");
            process.exit(0);
          }

          for (const [name, vulnerability] of entries) {
            const allowed = allowedResidual.get(name);
            if (!allowed) {
              console.error(`DEPENDENCY_AUDIT_POLICY_FAIL: unexpected vulnerable package ${name}`);
              process.exit(1);
            }

            if (vulnerability?.severity !== allowed.severity) {
              console.error(`DEPENDENCY_AUDIT_POLICY_FAIL: unexpected severity for ${name}`);
              process.exit(1);
            }

            const candidatePaths =
              name === "prisma"
                ? ["node_modules/prisma", "node_modules/prisma-cli"]
                : [`node_modules/${name}`];
            const installedVersions = candidatePaths
              .map((packagePath) => lockfile?.packages?.[packagePath]?.version)
              .filter(Boolean);

            if (installedVersions.length !== 1 || installedVersions[0] !== allowed.version) {
              console.error(`DEPENDENCY_AUDIT_POLICY_FAIL: unreviewed vulnerable version or layout for ${name}`);
              process.exit(1);
            }
          }

          const expectedNames = [...allowedResidual.keys()].sort();
          const actualNames = entries.map(([name]) => name).sort();
          if (actualNames.length !== expectedNames.length || actualNames.some((name, index) => name !== expectedNames[index])) {
            console.error("DEPENDENCY_AUDIT_POLICY_FAIL: reviewed residual set changed");
            process.exit(1);
          }

          const counts = report?.metadata?.vulnerabilities ?? {};
          const expectedHigh = entries.length;
          if (
            Number(counts.critical ?? 0) !== 0 ||
            Number(counts.high ?? 0) !== expectedHigh ||
            Number(counts.moderate ?? 0) !== 0 ||
            Number(counts.low ?? 0) !== 0 ||
            Number(counts.info ?? 0) !== 0 ||
            Number(counts.total ?? entries.length) !== entries.length
          ) {
            console.error("DEPENDENCY_AUDIT_POLICY_FAIL: unexpected vulnerability counts");
            process.exit(1);
          }

          console.log(
            "DEPENDENCY_AUDIT_POLICY_PASS: 3 reviewed Prisma CLI upstream residual findings; mysql2 is pinned to patched 3.24.3; no unreviewed findings",
          );
          EOF

      - name: Verify generated security state
        shell: bash
        run: |
          node --check scripts/check-production-install.mjs
          node --check scripts/check-npm-audit-policy.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const mysql = lock.packages?.["node_modules/mysql2"];
          if (packageJson.overrides?.mysql2 !== "3.24.3" || mysql?.version !== "3.24.3") {
            console.error("LOCK_REFRESH_FAIL: patched mysql2 override/lock mismatch");
            process.exit(1);
          }
          console.log("LOCK_REFRESH_PASS: mysql2@3.24.3 override and lock are aligned");
          NODE

      - name: Commit patched lock and remove helper
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          rm .github/workflows/lock-refresh-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json scripts/check-production-install.mjs scripts/check-npm-audit-policy.mjs .github/workflows/lock-refresh-helper.yml
          git commit -m "fix: patch mysql2 production residual"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${BRANCH_NAME}"
