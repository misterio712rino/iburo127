name: Staging External Readiness

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA to inspect
        required: true
        type: string
      confirmation:
        description: Type RUN_STAGING_EXTERNAL_READINESS
        required: true
        type: string
  push:
    branches:
      - audit/production-readiness

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref_name == 'audit/production-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      IB_STAGING_BASE_URL: https://iburo127-app-git-audit-pr-0d0d70-misterio712rino-9166s-projects.vercel.app
      IB_STAGING_DATABASE_NAME: neondb

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Exact staging gate
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'RUN_STAGING_EXTERNAL_READINESS' }}
        run: |
          if [ "$CONFIRMATION" != "RUN_STAGING_EXTERNAL_READINESS" ]; then
            echo "STAGING_EXTERNAL_READINESS_GATE_FAIL: confirmation mismatch" >&2
            exit 1
          fi
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "STAGING_EXTERNAL_READINESS_GATE_FAIL: candidate SHA must be 40 lowercase hex characters" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$actual_sha" != "$REQUESTED_SHA" ]; then
            echo "STAGING_EXTERNAL_READINESS_GATE_FAIL: exact candidate mismatch" >&2
            exit 1
          fi
          echo "STAGING_EXTERNAL_READINESS_GATE_PASS: $actual_sha"

      - name: Verify exact protected Preview identity
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          identity_file="$RUNNER_TEMP/staging-external-readiness-identity.json"
          max_attempts=18
          delay_seconds=5
          rm -f "$identity_file"
          trap 'rm -f "$identity_file"' EXIT

          for attempt in $(seq 1 "$max_attempts"); do
            http_status="$(
              curl --silent --show-error \
                --connect-timeout 5 \
                --max-time 15 \
                --output "$identity_file" \
                --write-out '%{http_code}' \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$IB_STAGING_BASE_URL/_iburo/staging-identity" \
                || true
            )"

            if [ "$http_status" = "200" ] && IDENTITY_FILE="$identity_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try {
                const body = JSON.parse(readFileSync(process.env.IDENTITY_FILE, "utf8"));
                if (
                  body.service === "iburo127" &&
                  body.environment === "preview" &&
                  body.branch === "audit/production-readiness" &&
                  body.commitSha === process.env.GITHUB_SHA &&
                  body.runtimeTarget === "staging" &&
                  body.backendEnabled === true
                ) process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              echo "STAGING_EXTERNAL_READINESS_IDENTITY_PASS"
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "STAGING_EXTERNAL_READINESS_IDENTITY_WAIT: attempt=$attempt/$max_attempts"
              sleep "$delay_seconds"
            fi
          done

          echo "STAGING_EXTERNAL_READINESS_IDENTITY_FAIL" >&2
          exit 1

      - name: Verify read-only staging database baseline
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          probe_file="$RUNNER_TEMP/staging-db-baseline.json"
          max_attempts=3
          delay_seconds=2
          rm -f "$probe_file"
          trap 'rm -f "$probe_file"' EXIT

          for attempt in $(seq 1 "$max_attempts"); do
            http_status="$(
              curl --silent --show-error \
                --connect-timeout 5 \
                --max-time 20 \
                --output "$probe_file" \
                --write-out '%{http_code}' \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$IB_STAGING_BASE_URL/_iburo/staging-db-baseline" \
                || true
            )"

            if [ "$http_status" = "200" ] && PROBE_FILE="$probe_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try {
                const body = JSON.parse(readFileSync(process.env.PROBE_FILE, "utf8"));
                if (
                  body.service === "iburo127" &&
                  body.probe === "staging-db-baseline" &&
                  body.environment === "preview" &&
                  body.branch === "audit/production-readiness" &&
                  body.commitSha === process.env.GITHUB_SHA &&
                  body.runtimeTarget === "staging" &&
                  body.readOnly === true &&
                  body.database?.name === process.env.IB_STAGING_DATABASE_NAME &&
                  body.database?.schema === "public" &&
                  body.domain?.tables?.pass === true &&
                  body.domain?.enums?.pass === true &&
                  body.domain?.storedFile?.scanColumnsPass === true &&
                  body.domain?.storedFile?.statusValuesPass === true &&
                  body.prisma?.migrationTablePresent === true &&
                  body.prisma?.unfinishedCount === 0 &&
                  body.prisma?.pass === true &&
                  body.pass === true
                ) process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              echo "STAGING_DB_BASELINE_READ_ONLY_PASS"
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "STAGING_DB_BASELINE_WAIT: attempt=$attempt/$max_attempts"
              sleep "$delay_seconds"
            fi
          done

          failure_stage="$(PROBE_FILE="$probe_file" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            try {
              const body = JSON.parse(readFileSync(process.env.PROBE_FILE, "utf8"));
              const stage = typeof body.failureStage === "string" && /^[a-z-]+$/.test(body.failureStage)
                ? body.failureStage
                : "unavailable";
              process.stdout.write(stage);
            } catch {
              process.stdout.write("unavailable");
            }
          ')"
          echo "STAGING_DB_BASELINE_READ_ONLY_FAIL: http_status=$http_status failure_stage=$failure_stage" >&2
          exit 1

      - name: Read external readiness inventory
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          inventory_file="$RUNNER_TEMP/staging-external-readiness-inventory.json"
          max_attempts=6
          delay_seconds=3
          rm -f "$inventory_file"
          trap 'rm -f "$inventory_file"' EXIT

          for attempt in $(seq 1 "$max_attempts"); do
            http_status="$(
              curl --silent --show-error \
                --connect-timeout 5 \
                --max-time 20 \
                --output "$inventory_file" \
                --write-out '%{http_code}' \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$IB_STAGING_BASE_URL/_iburo/staging-external-readiness" \
                || true
            )"

            if [ "$http_status" = "200" ] && INVENTORY_FILE="$inventory_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try {
                const body = JSON.parse(readFileSync(process.env.INVENTORY_FILE, "utf8"));
                if (
                  body.service === "iburo127" &&
                  body.operation === "staging-external-readiness" &&
                  body.environment === "preview" &&
                  body.branch === "audit/production-readiness" &&
                  body.commitSha === process.env.GITHUB_SHA &&
                  body.runtimeTarget === "staging" &&
                  body.networkAccessed === false &&
                  body.valuesPrinted === false &&
                  body.phases?.storage &&
                  body.phases?.scanner
                ) process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              INVENTORY_FILE="$inventory_file" node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const body = JSON.parse(readFileSync(process.env.INVENTORY_FILE, "utf8"));
                console.log(JSON.stringify({ phases: body.phases }, null, 2));
              '
              echo "STAGING_EXTERNAL_READINESS_INVENTORY_PASS"
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "STAGING_EXTERNAL_READINESS_INVENTORY_WAIT: attempt=$attempt/$max_attempts"
              sleep "$delay_seconds"
            fi
          done

          echo "STAGING_EXTERNAL_READINESS_INVENTORY_FAIL" >&2
          exit 1

      - name: Clean stale guarded file-scan fixtures
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          cleanup_file="$RUNNER_TEMP/staging-file-scan-fixture-cleanup.json"
          rm -f "$cleanup_file"
          trap 'rm -f "$cleanup_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 45 \
              --output "$cleanup_file" \
              --write-out '%{http_code}' \
              --request POST \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-iburo-staging-file-scan-cleanup-confirm: CLEAN_STAGING_FILE_SCAN_FIXTURES:${GITHUB_SHA}" \
              "$IB_STAGING_BASE_URL/_iburo/staging-file-scan-fixture-cleanup" \
              || true
          )"

          if [ "$http_status" != "200" ]; then
            echo "STAGING_FILE_SCAN_FIXTURE_CLEANUP_FAIL: http_status=$http_status" >&2
            exit 1
          fi

          CLEANUP_FILE="$cleanup_file" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const body = JSON.parse(readFileSync(process.env.CLEANUP_FILE, "utf8"));
            if (
              body.service !== "iburo127" ||
              body.operation !== "staging-file-scan-fixture-cleanup" ||
              body.environment !== "preview" ||
              body.branch !== "audit/production-readiness" ||
              body.commitSha !== process.env.GITHUB_SHA ||
              body.runtimeTarget !== "staging" ||
              body.pass !== true ||
              !Number.isInteger(body.deleted) ||
              body.deleted < 0 ||
              body.deleted > 100 ||
              body.maxFixtures !== 100 ||
              body.minimumAgeMinutes !== 30 ||
              body.aggregateOnly !== true ||
              body.valuesPrinted !== false
            ) process.exit(1);
            console.log(`STAGING_FILE_SCAN_FIXTURE_CLEANUP_PASS: deleted=${body.deleted}`);
          '

      - name: Verify aggregate maintenance backlog health
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          health_file="$RUNNER_TEMP/staging-maintenance-health.json"
          rm -f "$health_file"
          trap 'rm -f "$health_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 30 \
              --output "$health_file" \
              --write-out '%{http_code}' \
              --request POST \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-iburo-staging-maintenance-health-confirm: RUN_STAGING_MAINTENANCE_HEALTH:${GITHUB_SHA}" \
              "$IB_STAGING_BASE_URL/_iburo/staging-maintenance-health" \
              || true
          )"

          if [ "$http_status" != "200" ]; then
            HEALTH_FILE="$health_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try {
                const body = JSON.parse(readFileSync(process.env.HEALTH_FILE, "utf8"));
                const safe = {
                  pass: body.pass === true,
                  aggregateOnly: body.aggregateOnly === true,
                  valuesPrinted: body.valuesPrinted === true,
                  errorCode: typeof body.errorCode === "string" ? body.errorCode : null,
                  jobs: body.jobs ?? null,
                };
                console.error(`STAGING_MAINTENANCE_BACKLOG_DIAGNOSTIC: ${JSON.stringify(safe)}`);
              } catch {
                console.error("STAGING_MAINTENANCE_BACKLOG_DIAGNOSTIC: unavailable");
              }
            '
            echo "STAGING_MAINTENANCE_BACKLOG_HEALTH_FAIL: http_status=$http_status" >&2
            exit 1
          fi

          HEALTH_FILE="$health_file" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const body = JSON.parse(readFileSync(process.env.HEALTH_FILE, "utf8"));
            const jobs = body.jobs ?? {};
            const expectedJobs = ["notificationDelivery", "staleUploads", "fileScans", "fileDeletion", "aiAudit"];
            if (
              body.service !== "iburo127" ||
              body.operation !== "staging-maintenance-health" ||
              body.environment !== "preview" ||
              body.branch !== "audit/production-readiness" ||
              body.commitSha !== process.env.GITHUB_SHA ||
              body.runtimeTarget !== "staging" ||
              body.pass !== true ||
              body.aggregateOnly !== true ||
              body.valuesPrinted !== false ||
              expectedJobs.some((name) => jobs[name]?.healthy !== true)
            ) {
              process.exit(1);
            }
          '
          echo "STAGING_MAINTENANCE_BACKLOG_HEALTH_PASS"

      - name: Verify private staging storage
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 5 \
            --max-time 30 \
            --request POST \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H "x-iburo-staging-storage-confirm: RUN_STAGING_STORAGE_VERIFY" \
            "$IB_STAGING_BASE_URL/_iburo/staging-storage-verify" \
          | node --input-type=module -e '
              let input = "";
              for await (const chunk of process.stdin) input += chunk;
              const body = JSON.parse(input);
              if (
                body.service !== "iburo127" ||
                body.operation !== "staging-storage-verify" ||
                body.environment !== "preview" ||
                body.branch !== "audit/production-readiness" ||
                body.commitSha !== process.env.GITHUB_SHA ||
                body.runtimeTarget !== "staging" ||
                body.provider !== "vercel-blob" ||
                body.verified !== true ||
                body.signedTokenIssued !== true ||
                body.privateHostVerified !== true ||
                body.networkAccessed !== true ||
                body.valuesPrinted !== false ||
                body.objectEnumerationContentOperations !== 0
              ) {
                console.error("STAGING_OBJECT_STORAGE_VERIFY_FAIL");
                process.exit(1);
              }
              console.log("STAGING_OBJECT_STORAGE_PROVIDER: vercel-blob");
              console.log("STAGING_OBJECT_STORAGE_NETWORK_ACCESS: signed-token-only");
              console.log("STAGING_OBJECT_STORAGE_OBJECT_OPERATIONS: 0");
              console.log("STAGING_OBJECT_STORAGE_VERIFY_PASS");
            '
