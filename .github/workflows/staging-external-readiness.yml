name: Staging External Readiness

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA to inspect
        required: true
        type: string
      confirmation:
        description: Type RUN_STAGING_EXTERNAL_READINESS
        required: true
        type: string
  push:
    branches:
      - audit/production-readiness

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref_name == 'audit/production-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      IB_STAGING_BASE_URL: https://iburo127-app-git-audit-pr-0d0d70-misterio712rino-9166s-projects.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Exact staging gate
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'RUN_STAGING_EXTERNAL_READINESS' }}
        run: |
          if [ "$CONFIRMATION" != "RUN_STAGING_EXTERNAL_READINESS" ]; then
            echo "STAGING_EXTERNAL_READINESS_GATE_FAIL: confirmation mismatch" >&2
            exit 1
          fi
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "STAGING_EXTERNAL_READINESS_GATE_FAIL: candidate SHA must be 40 lowercase hex characters" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$actual_sha" != "$REQUESTED_SHA" ]; then
            echo "STAGING_EXTERNAL_READINESS_GATE_FAIL: exact candidate mismatch" >&2
            exit 1
          fi
          echo "STAGING_EXTERNAL_READINESS_GATE_PASS: $actual_sha"

      - name: Apply reviewed access-gate staging migration
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          response_file="$RUNNER_TEMP/staging-access-gate-migration.json"
          status=""
          for attempt in $(seq 1 24); do
            status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-iburo-staging-migration-confirm: APPLY:20260901_access_gate_leads:${GITHUB_SHA}" \
              "$IB_STAGING_BASE_URL/_iburo/staging-access-gate-migrate" || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            failure_stage="$(node --input-type=module - "$response_file" <<'NODE'
          import { readFile } from "node:fs/promises";
          const allowed = new Set([
            "preview-boundary", "target", "confirmation", "connect", "begin", "lock",
            "identity", "history-baseline", "schema-baseline", "migration",
            "history-write", "verification", "commit"
          ]);
          try {
            const body = JSON.parse(await readFile(process.argv[2], "utf8"));
            process.stdout.write(allowed.has(body.failureStage) ? body.failureStage : "unavailable");
          } catch {
            process.stdout.write("unavailable");
          }
          NODE
          )"
            echo "Waiting for exact Preview migration endpoint (attempt ${attempt}/24, status=${status:-network}, stage=${failure_stage})"
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "STAGING_ACCESS_GATE_MIGRATION_FAIL: endpoint did not return 200" >&2
            exit 1
          fi
          node --input-type=module - "$response_file" <<'NODE'
          import { readFile } from "node:fs/promises";
          const path = process.argv[2];
          const body = JSON.parse(await readFile(path, "utf8"));
          if (
            body.service !== "iburo127" ||
            body.operation !== "staging-access-gate-migrate" ||
            body.environment !== "preview" ||
            body.branch !== "audit/production-readiness" ||
            body.commitSha !== process.env.GITHUB_SHA ||
            body.runtimeTarget !== "staging" ||
            body.database !== "neondb" ||
            body.migration !== "20260901_access_gate_leads" ||
            body.migrationChecksum !== "bbb60f3e7207a9ea986bef9d5624af0b3ba4b0c265fe6d80e17d950ddb623a9a" ||
            body.migrationCount !== 2 ||
            body.tableReady !== true ||
            body.enumsReady !== true ||
            body.indexesReady !== true ||
            body.valuesPrinted !== false ||
            body.pass !== true
          ) {
            console.error("STAGING_ACCESS_GATE_MIGRATION_FAIL: verification mismatch");
            process.exit(1);
          }
          console.log("STAGING_ACCESS_GATE_MIGRATION_PASS");
          NODE

      - name: Verify exact protected Preview identity
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          curl --silent --show-error --fail-with-body \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$IB_STAGING_BASE_URL/_iburo/staging-identity" \
          | node --input-type=module -e '
              let input = "";
              for await (const chunk of process.stdin) input += chunk;
              const body = JSON.parse(input);
              if (
                body.service !== "iburo127" ||
                body.environment !== "preview" ||
                body.branch !== "audit/production-readiness" ||
                body.commitSha !== process.env.GITHUB_SHA ||
                body.runtimeTarget !== "staging" ||
                body.backendEnabled !== true
              ) {
                console.error("STAGING_EXTERNAL_READINESS_IDENTITY_FAIL");
                process.exit(1);
              }
              console.log("STAGING_EXTERNAL_READINESS_IDENTITY_PASS");
            '

      - name: Read external readiness inventory
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          curl --silent --show-error --fail-with-body \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$IB_STAGING_BASE_URL/_iburo/staging-external-readiness" \
          | node --input-type=module -e '
              let input = "";
              for await (const chunk of process.stdin) input += chunk;
              const body = JSON.parse(input);
              if (
                body.service !== "iburo127" ||
                body.operation !== "staging-external-readiness" ||
                body.environment !== "preview" ||
                body.branch !== "audit/production-readiness" ||
                body.commitSha !== process.env.GITHUB_SHA ||
                body.runtimeTarget !== "staging" ||
                body.networkAccessed !== false ||
                body.valuesPrinted !== false ||
                !body.phases?.storage ||
                !body.phases?.scanner
              ) {
                console.error("STAGING_EXTERNAL_READINESS_INVENTORY_FAIL");
                process.exit(1);
              }
              console.log(JSON.stringify({ phases: body.phases }, null, 2));
              console.log("STAGING_EXTERNAL_READINESS_INVENTORY_PASS");
            '

      - name: Verify private staging storage
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          curl --silent --show-error --fail-with-body \
            --request POST \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H "x-iburo-staging-storage-confirm: RUN_STAGING_STORAGE_VERIFY" \
            "$IB_STAGING_BASE_URL/_iburo/staging-storage-verify" \
          | node --input-type=module -e '
              let input = "";
              for await (const chunk of process.stdin) input += chunk;
              const body = JSON.parse(input);
              if (
                body.service !== "iburo127" ||
                body.operation !== "staging-storage-verify" ||
                body.environment !== "preview" ||
                body.branch !== "audit/production-readiness" ||
                body.commitSha !== process.env.GITHUB_SHA ||
                body.runtimeTarget !== "staging" ||
                body.provider !== "vercel-blob" ||
                body.verified !== true ||
                body.signedTokenIssued !== true ||
                body.privateHostVerified !== true ||
                body.networkAccessed !== true ||
                body.valuesPrinted !== false ||
                body.objectEnumerationContentOperations !== 0
              ) {
                console.error("STAGING_OBJECT_STORAGE_VERIFY_FAIL");
                process.exit(1);
              }
              console.log("STAGING_OBJECT_STORAGE_PROVIDER: vercel-blob");
              console.log("STAGING_OBJECT_STORAGE_NETWORK_ACCESS: signed-token-only");
              console.log("STAGING_OBJECT_STORAGE_OBJECT_OPERATIONS: 0");
              console.log("STAGING_OBJECT_STORAGE_VERIFY_PASS");
            '
