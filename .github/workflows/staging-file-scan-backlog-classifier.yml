name: Staging File Scan Backlog Classifier

on:
  push:
    branches:
      - audit/production-readiness

permissions:
  contents: read

jobs:
  classify:
    if: github.ref_name == 'audit/production-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      pending: ${{ steps.aggregate.outputs.pending }}
      known: ${{ steps.aggregate.outputs.known }}
      unknown: ${{ steps.aggregate.outputs.unknown }}
      overdue: ${{ steps.aggregate.outputs.overdue }}
      unscheduled: ${{ steps.aggregate.outputs.unscheduled }}
      zero_attempts: ${{ steps.aggregate.outputs.zero_attempts }}
      older_7d: ${{ steps.aggregate.outputs.older_7d }}
    env:
      IB_STAGING_BASE_URL: https://iburo127-app-git-audit-pr-0d0d70-misterio712rino-9166s-projects.vercel.app

    steps:
      - name: Verify exact protected Preview and classify aggregate backlog
        id: aggregate
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          identity_file="$RUNNER_TEMP/staging-file-scan-classifier-identity.json"
          classifier_file="$RUNNER_TEMP/staging-file-scan-classifier.json"
          identity_max_attempts=18
          identity_delay_seconds=5
          classifier_max_attempts=6
          classifier_delay_seconds=3
          rm -f "$identity_file" "$classifier_file"
          trap 'rm -f "$identity_file" "$classifier_file"' EXIT

          for attempt in $(seq 1 "$identity_max_attempts"); do
            identity_status="$(
              curl --silent --show-error \
                --connect-timeout 5 \
                --max-time 15 \
                --output "$identity_file" \
                --write-out '%{http_code}' \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$IB_STAGING_BASE_URL/_iburo/staging-identity" \
                || true
            )"

            if [ "$identity_status" = "200" ] && IDENTITY_FILE="$identity_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try {
                const body = JSON.parse(readFileSync(process.env.IDENTITY_FILE, "utf8"));
                if (
                  body.service === "iburo127" &&
                  body.environment === "preview" &&
                  body.branch === "audit/production-readiness" &&
                  body.commitSha === process.env.GITHUB_SHA &&
                  body.runtimeTarget === "staging" &&
                  body.backendEnabled === true
                ) process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              break
            fi

            if [ "$attempt" = "$identity_max_attempts" ]; then
              echo "STAGING_FILE_SCAN_CLASSIFIER_IDENTITY_FAIL" >&2
              exit 1
            fi
            sleep "$identity_delay_seconds"
          done

          for attempt in $(seq 1 "$classifier_max_attempts"); do
            classifier_status="$(
              curl --silent --show-error \
                --connect-timeout 5 \
                --max-time 20 \
                --output "$classifier_file" \
                --write-out '%{http_code}' \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$IB_STAGING_BASE_URL/_iburo/staging-file-scan-backlog-classifier" \
                || true
            )"

            if [ "$classifier_status" = "200" ] && CLASSIFIER_FILE="$classifier_file" node --input-type=module -e '
              import { appendFileSync, readFileSync } from "node:fs";
              try {
                const body = JSON.parse(readFileSync(process.env.CLASSIFIER_FILE, "utf8"));
                const integer = (value) => Number.isInteger(value) && value >= 0;
                const requiredCounts = [
                  body?.statuses?.pendingScan,
                  body?.statuses?.scanning,
                  body?.statuses?.scanFailed,
                  body?.statuses?.quarantined,
                  body?.pendingAge?.under30Minutes,
                  body?.pendingAge?.from30MinutesTo6Hours,
                  body?.pendingAge?.from6To24Hours,
                  body?.pendingAge?.from1To7Days,
                  body?.pendingAge?.olderThan7Days,
                  body?.pendingSchedule?.dueOrOverdue,
                  body?.pendingSchedule?.scheduledFuture,
                  body?.pendingSchedule?.unscheduled,
                  body?.pendingAttempts?.zero,
                  body?.pendingAttempts?.oneToTwo,
                  body?.pendingAttempts?.threeOrMore,
                  body?.provenance?.strictKnownTechnicalFixtures,
                  body?.provenance?.unknownOrNonTechnical,
                ];
                if (
                  body?.service !== "iburo127" ||
                  body?.operation !== "staging-file-scan-backlog-classifier" ||
                  body?.environment !== "preview" ||
                  body?.branch !== "audit/production-readiness" ||
                  body?.commitSha !== process.env.GITHUB_SHA ||
                  body?.runtimeTarget !== "staging" ||
                  body?.readOnly !== true ||
                  body?.aggregateOnly !== true ||
                  body?.valuesPrinted !== false ||
                  !requiredCounts.every(integer) ||
                  body.statuses.pendingScan !==
                    body.provenance.strictKnownTechnicalFixtures + body.provenance.unknownOrNonTechnical
                ) {
                  process.exit(1);
                }
                const output = [
                  `pending=${body.statuses.pendingScan}`,
                  `known=${body.provenance.strictKnownTechnicalFixtures}`,
                  `unknown=${body.provenance.unknownOrNonTechnical}`,
                  `overdue=${body.pendingSchedule.dueOrOverdue}`,
                  `unscheduled=${body.pendingSchedule.unscheduled}`,
                  `zero_attempts=${body.pendingAttempts.zero}`,
                  `older_7d=${body.pendingAge.olderThan7Days}`,
                ].join("\n") + "\n";
                appendFileSync(process.env.GITHUB_OUTPUT, output);
                process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              echo "STAGING_FILE_SCAN_CLASSIFIER_PASS"
              exit 0
            fi

            if [ "$attempt" -lt "$classifier_max_attempts" ]; then
              echo "STAGING_FILE_SCAN_CLASSIFIER_WAIT: attempt=$attempt/$classifier_max_attempts status=$classifier_status"
              sleep "$classifier_delay_seconds"
            fi
          done

          echo "STAGING_FILE_SCAN_CLASSIFIER_FAIL: exact classifier response did not converge" >&2
          exit 1

  aggregate-proof:
    needs: classify
    runs-on: ubuntu-24.04
    name: >-
      Scan backlog p=${{ needs.classify.outputs.pending }}
      known=${{ needs.classify.outputs.known }}
      unknown=${{ needs.classify.outputs.unknown }}
      overdue=${{ needs.classify.outputs.overdue }}
      unscheduled=${{ needs.classify.outputs.unscheduled }}
      zeroAttempts=${{ needs.classify.outputs.zero_attempts }}
      older7d=${{ needs.classify.outputs.older_7d }}
    steps:
      - name: Aggregate proof recorded
        shell: bash
        run: echo "STAGING_FILE_SCAN_AGGREGATE_PROOF_PASS"
