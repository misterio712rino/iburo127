name: Staging File Scanner Image One Shot

on:
  push:
    branches:
      - audit/production-readiness
    paths:
      - .github/workflows/staging-file-scanner-image-one-shot.yml

permissions:
  contents: read

jobs:
  publish-staging-image:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: fdff3b0ec6c455c65b74d644932a494b554d20c7
      REGISTRY_ID: crpj5f1c403edf9ltnlu
      PUBLISHER_SERVICE_ACCOUNT_ID: ajel9bf7bpn8e6l4063b

    steps:
      - name: Enforce one-shot staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "misterio712rino/iburo127"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/audit/production-readiness"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REGISTRY_ID" =~ ^[a-z0-9]+$ ]]
          [[ "$PUBLISHER_SERVICE_ACCOUNT_ID" =~ ^[a-z0-9]+$ ]]
          echo "STAGING_FILE_SCANNER_ONE_SHOT_BOUNDARY_PASS"

      - name: Checkout exact audited candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -f services/file-scanner/Dockerfile
          echo "STAGING_FILE_SCANNER_EXACT_CANDIDATE_PASS=$CANDIDATE_SHA"

      - name: Publish immutable staging image through Yandex WIF
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logout cr.yandex >/dev/null 2>&1 || true; rm -f /tmp/wif-exchange.json; unset oidc_jwt iam_token oidc_response exchange_status exchange_response image_repository image_tag image_digest immutable_image jwt_payload jwt_b64 jwt_pad' EXIT

          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Fmisterio712rino")"
          oidc_jwt="$(printf '%s' "$oidc_response" | jq -er '.value | strings | select(length > 0)')"
          test -n "$oidc_jwt"
          echo "::add-mask::$oidc_jwt"

          jwt_b64="$(printf '%s' "$oidc_jwt" | cut -d. -f2 | tr '_-' '/+')"
          jwt_pad=$(( (4 - ${#jwt_b64} % 4) % 4 ))
          jwt_b64="${jwt_b64}$(printf '=%.0s' $(seq 1 "$jwt_pad") 2>/dev/null || true)"
          jwt_payload="$(printf '%s' "$jwt_b64" | base64 -d 2>/dev/null)"
          printf '%s' "$jwt_payload" | jq -c '{iss,aud,sub,repository,ref,workflow,job_workflow_ref}'

          exchange_status="$(printf '%s' "$oidc_jwt" | curl --silent --show-error --output /tmp/wif-exchange.json --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --data-urlencode "audience=${PUBLISHER_SERVICE_ACCOUNT_ID}" \
            --data-urlencode 'subject_token@-' \
            https://auth.yandex.cloud/oauth/token)"
          echo "YANDEX_WIF_EXCHANGE_HTTP_STATUS=$exchange_status"
          if [ "$exchange_status" != "200" ]; then
            jq -r '"YANDEX_WIF_ERROR=" + (.error // "unknown"), "YANDEX_WIF_ERROR_DESCRIPTION=" + (.error_description // "unspecified")' /tmp/wif-exchange.json
            exit 22
          fi

          exchange_response="$(cat /tmp/wif-exchange.json)"
          iam_token="$(printf '%s' "$exchange_response" | jq -er '.access_token | strings | select(length > 0)')"
          test -n "$iam_token"
          echo "::add-mask::$iam_token"

          image_repository="cr.yandex/${REGISTRY_ID}/iburo-file-scanner"
          image_tag="${image_repository}:${CANDIDATE_SHA}"
          docker build --pull=false --tag "$image_tag" services/file-scanner
          printf '%s' "$iam_token" | docker login cr.yandex --username iam --password-stdin
          docker push "$image_tag"
          image_digest="$(docker buildx imagetools inspect "$image_tag" --format '{{.Digest}}')"
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          immutable_image="${image_repository}@${image_digest}"

          echo "STAGING_FILE_SCANNER_IMAGE_CANDIDATE_SHA=$CANDIDATE_SHA"
          echo "STAGING_FILE_SCANNER_REGISTRY_ID=$REGISTRY_ID"
          echo "STAGING_FILE_SCANNER_IMAGE_REPOSITORY=$image_repository"
          echo "STAGING_FILE_SCANNER_IMAGE_TAG=$image_tag"
          echo "STAGING_FILE_SCANNER_IMAGE_DIGEST=$image_digest"
          echo "STAGING_FILE_SCANNER_IMMUTABLE_IMAGE=$immutable_image"
          echo "STAGING_FILE_SCANNER_IMAGE_PUBLISHED_NOT_DEPLOYED"
