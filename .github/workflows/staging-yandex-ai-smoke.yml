name: Staging Yandex AI Smoke

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA to verify
        required: true
        type: string
      confirmation:
        description: Type RUN_STAGING_YANDEX_AI_SMOKE
        required: true
        type: string
  push:
    branches:
      - audit/production-readiness
    paths:
      - "app/%5Fiburo/staging-ai-verify/route.ts"
      - ".github/workflows/staging-yandex-ai-smoke.yml"

permissions:
  contents: read

jobs:
  verify:
    if: github.ref_name == 'audit/production-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      IB_STAGING_BASE_URL: https://iburo127-app-git-audit-pr-0d0d70-misterio712rino-9166s-projects.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Exact staging gate
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'RUN_STAGING_YANDEX_AI_SMOKE' }}
        run: |
          if [ "$CONFIRMATION" != "RUN_STAGING_YANDEX_AI_SMOKE" ]; then
            echo "STAGING_YANDEX_AI_GATE_FAIL: confirmation mismatch" >&2
            exit 1
          fi
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "STAGING_YANDEX_AI_GATE_FAIL: candidate SHA must be 40 lowercase hex characters" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$actual_sha" != "$REQUESTED_SHA" ]; then
            echo "STAGING_YANDEX_AI_GATE_FAIL: exact candidate mismatch" >&2
            exit 1
          fi
          echo "STAGING_YANDEX_AI_GATE_PASS: $actual_sha"

      - name: Wait for exact protected Preview
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          identity_file="$RUNNER_TEMP/staging-yandex-ai-identity.json"
          max_attempts=24
          stable_matches=0
          rm -f "$identity_file"
          trap 'rm -f "$identity_file"' EXIT

          for attempt in $(seq 1 "$max_attempts"); do
            http_status="$(
              curl --silent --show-error \
                --output "$identity_file" \
                --write-out '%{http_code}' \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$IB_STAGING_BASE_URL/_iburo/staging-identity" \
                || true
            )"

            if [ "$http_status" = "200" ] && IDENTITY_FILE="$identity_file" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              try {
                const body = JSON.parse(readFileSync(process.env.IDENTITY_FILE, "utf8"));
                if (
                  body.service === "iburo127" &&
                  body.environment === "preview" &&
                  body.branch === "audit/production-readiness" &&
                  body.commitSha === process.env.GITHUB_SHA &&
                  body.runtimeTarget === "staging" &&
                  body.backendEnabled === true
                ) process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              stable_matches=$((stable_matches + 1))
              echo "STAGING_YANDEX_AI_IDENTITY_MATCH: $stable_matches/3"
              if [ "$stable_matches" -ge 3 ]; then
                echo "STAGING_YANDEX_AI_IDENTITY_PASS"
                exit 0
              fi
            else
              stable_matches=0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep 5
            fi
          done

          echo "STAGING_YANDEX_AI_IDENTITY_FAIL" >&2
          exit 1

      - name: Verify live Yandex AI provider
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          response_file="$RUNNER_TEMP/staging-yandex-ai-response.json"
          rm -f "$response_file"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-iburo-staging-ai-confirm: RUN_STAGING_AI_VERIFY" \
              "$IB_STAGING_BASE_URL/_iburo/staging-ai-verify" \
              || true
          )"

          if [ "$http_status" != "200" ]; then
            RESPONSE_FILE="$response_file" HTTP_STATUS="$http_status" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              let code = "UNKNOWN";
              try {
                const body = JSON.parse(readFileSync(process.env.RESPONSE_FILE, "utf8"));
                if (typeof body.errorCode === "string") code = body.errorCode;
              } catch {}
              console.error(`STAGING_YANDEX_AI_VERIFY_FAIL: http=${process.env.HTTP_STATUS} code=${code}`);
            '
            exit 1
          fi

          RESPONSE_FILE="$response_file" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const body = JSON.parse(readFileSync(process.env.RESPONSE_FILE, "utf8"));
            if (
              body.service !== "iburo127" ||
              body.operation !== "staging-ai-verify" ||
              body.environment !== "preview" ||
              body.branch !== "audit/production-readiness" ||
              body.commitSha !== process.env.GITHUB_SHA ||
              body.runtimeTarget !== "staging" ||
              body.provider !== "yandex" ||
              body.verified !== true ||
              body.markerMatched !== true ||
              body.networkAccessed !== true ||
              body.valuesPrinted !== false ||
              body.clientCaseDataIncluded !== false ||
              body.providerResponseLogged !== false ||
              body.providerRequestDataLogging !== "disabled"
            ) {
              console.error("STAGING_YANDEX_AI_VERIFY_FAIL: invalid safe response contract");
              process.exit(1);
            }
            console.log("STAGING_YANDEX_AI_PROVIDER: yandex");
            console.log("STAGING_YANDEX_AI_CLIENT_CASE_DATA_INCLUDED: 0");
            console.log("STAGING_YANDEX_AI_PROVIDER_RESPONSE_LOGGED: 0");
            console.log("STAGING_YANDEX_AI_PROVIDER_REQUEST_DATA_LOGGING: disabled");
            console.log("STAGING_YANDEX_AI_VERIFY_PASS");
          '
