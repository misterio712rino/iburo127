name: CI

on:
  push:
    branches:
      - demo/investor-preview
      - audit/production-readiness
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: GitHub Actions pin policy
        run: npm run check:ci-action-pins

      - name: GitHub workflow security policy
        run: npm run check:ci-workflow-security

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Toolchain policy
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit policy
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node scripts/report-npm-audit.mjs "$RUNNER_TEMP/npm-audit.json"
          node scripts/check-npm-audit-policy.mjs "$RUNNER_TEMP/npm-audit.json" package-lock.json

      - name: Prisma CLI production isolation policy
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const config = readFileSync("prisma.config.ts", "utf8");
          const legacy =
            packageJson.devDependencies?.prisma === "7.9.1" &&
            packageJson.devDependencies?.["prisma-cli"] === undefined &&
            config.includes('from "prisma/config"');
          const aliased =
            packageJson.devDependencies?.prisma === undefined &&
            packageJson.devDependencies?.["prisma-cli"] === "npm:prisma@7.9.1" &&
            config.includes('from "prisma-cli/config"');

          if (!legacy && !aliased) {
            console.error("PRISMA_ISOLATION_FAIL: unsupported Prisma dependency/config state");
            process.exit(1);
          }

          const state = legacy ? "legacy" : "aliased";
          writeFileSync(join(process.env.RUNNER_TEMP, "prisma-isolation-state"), state);

          if (legacy) {
            delete packageJson.devDependencies.prisma;
            packageJson.devDependencies["prisma-cli"] = "npm:prisma@7.9.1";
            writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
            writeFileSync(
              "prisma.config.ts",
              config.replace('from "prisma/config"', 'from "prisma-cli/config"'),
            );
          }

          console.log(`PRISMA_ISOLATION_STATE: ${state}`);
          NODE

          state="$(cat "$RUNNER_TEMP/prisma-isolation-state")"
          if [ "$state" = "legacy" ]; then
            npm install --package-lock-only --ignore-scripts --audit=false --fund=false
            npm ci
          fi

          test -x node_modules/.bin/prisma
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const aliased = JSON.parse(readFileSync("node_modules/prisma-cli/package.json", "utf8"));
          if (aliased.name !== "prisma" || aliased.version !== "7.9.1") {
            console.error("PRISMA_ISOLATION_FAIL: alias did not install pinned Prisma CLI");
            process.exit(1);
          }
          console.log("PRISMA_ISOLATION_CLI_PASS");
          NODE

          npm audit --json > "$RUNNER_TEMP/npm-audit-prisma-isolation.json" || true
          node scripts/report-npm-audit.mjs "$RUNNER_TEMP/npm-audit-prisma-isolation.json"
          node scripts/check-npm-audit-policy.mjs "$RUNNER_TEMP/npm-audit-prisma-isolation.json" package-lock.json

          production_root="$RUNNER_TEMP/iburo-production-install"
          rm -rf "$production_root"
          mkdir -p "$production_root"
          cp package.json package-lock.json "$production_root/"
          (
            cd "$production_root"
            npm ci --omit=dev --ignore-scripts --audit=false --fund=false
          )
          node scripts/check-production-install.mjs "$production_root"

          if [ "$state" = "legacy" ]; then
            echo "PRISMA_ISOLATION_PREVIEW_DIFF:"
            git diff --numstat -- package.json package-lock.json prisma.config.ts
          else
            git diff --exit-code -- package.json package-lock.json prisma.config.ts
            echo "PRISMA_ISOLATION_COMMITTED_STATE_PASS"
          fi

      - name: Runtime PII logging gate
        run: npm run check:runtime-logging

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Production foundation tests
        run: npm run test:foundation

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
