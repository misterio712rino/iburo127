name: CI

on:
  push:
    branches:
      - demo/investor-preview
      - audit/production-readiness
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit report
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node scripts/report-npm-audit.mjs "$RUNNER_TEMP/npm-audit.json"

      - name: Dependency path diagnostics
        shell: bash
        run: |
          for package in \
            '@prisma/config' \
            'brace-expansion' \
            'deepmerge-ts' \
            'fast-uri' \
            'ip-address' \
            'js-yaml' \
            'nanoid' \
            'prisma' \
            'undici' \
            '@hono/node-server' \
            'hono'
          do
            echo "DEPENDENCY_EXPLAIN_BEGIN: $package"
            npm explain "$package" || true
            echo "DEPENDENCY_EXPLAIN_END: $package"
          done

      - name: Runtime PII logging gate
        run: npm run check:runtime-logging

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Production foundation tests
        run: npm run test:foundation

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
