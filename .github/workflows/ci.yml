name: CI

on:
  push:
    branches:
      - demo/investor-preview
      - audit/production-readiness
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit policy
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node scripts/report-npm-audit.mjs "$RUNNER_TEMP/npm-audit.json"
          node scripts/check-npm-audit-policy.mjs "$RUNNER_TEMP/npm-audit.json" package-lock.json

      - name: Prisma CLI alias remediation preview
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          if (packageJson.devDependencies?.prisma !== "7.9.1") {
            console.error("PRISMA_ALIAS_PREVIEW_FAIL: unexpected prisma dev dependency");
            process.exit(1);
          }
          delete packageJson.devDependencies.prisma;
          packageJson.devDependencies["prisma-cli"] = "npm:prisma@7.9.1";
          writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts --audit=false --fund=false
          npm ci
          test -x node_modules/.bin/prisma
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const aliased = JSON.parse(readFileSync("node_modules/prisma-cli/package.json", "utf8"));
          if (aliased.name !== "prisma" || aliased.version !== "7.9.1") {
            console.error("PRISMA_ALIAS_PREVIEW_FAIL: alias did not install pinned Prisma CLI");
            process.exit(1);
          }
          console.log("PRISMA_ALIAS_PREVIEW_CLI_PASS");
          NODE
          npm audit --json > "$RUNNER_TEMP/npm-audit-alias-preview.json" || true
          node scripts/report-npm-audit.mjs "$RUNNER_TEMP/npm-audit-alias-preview.json"
          production_root="$RUNNER_TEMP/iburo-production-install"
          mkdir -p "$production_root"
          cp package.json package-lock.json "$production_root/"
          (
            cd "$production_root"
            npm ci --omit=dev --ignore-scripts --audit=false --fund=false
          )
          node scripts/check-production-install.mjs "$production_root"
          echo "PRISMA_ALIAS_PREVIEW_DIFF:"
          git diff --numstat -- package.json package-lock.json

      - name: Runtime PII logging gate
        run: npm run check:runtime-logging

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Production foundation tests
        run: npm run test:foundation

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
