name: Audit Lockfile Finalizer

on:
  push:
    branches:
      - audit/production-readiness

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'chore: finalize patched lockfile on audit branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact service commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Generate patched lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify qs patch
        run: |
          node --input-type=module -e 'import lock from "./package-lock.json" with { type: "json" }; if (lock.packages?.["node_modules/qs"]?.version !== "6.16.0") process.exit(1); console.log("LOCKFILE_QS_PATCH_PASS")'

      - name: Restore canonical hardened CI workflow
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 94837e8c772ad76825009e72d995083dc86f136c
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          test "$(git hash-object .github/workflows/ci.yml)" = "44466113781ed688a8b3551f05bc360a0be45883"
          echo "CANONICAL_CI_RESTORE_PASS"

      - name: Commit exact lockfile and restored CI
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/ci.yml' 'package-lock.json' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml package-lock.json
          git commit -m "fix: refresh patched qs lockfile"
          git push origin HEAD:audit/production-readiness
