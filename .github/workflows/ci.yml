name: CI

on:
  push:
    branches:
      - demo/investor-preview
      - audit/production-readiness
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit policy
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node scripts/report-npm-audit.mjs "$RUNNER_TEMP/npm-audit.json"
          node scripts/check-npm-audit-policy.mjs "$RUNNER_TEMP/npm-audit.json" package-lock.json

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Runtime PII logging gate
        run: npm run check:runtime-logging

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Production foundation tests
        run: npm run test:foundation

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
